name: Update contributions and project pages

on:
  schedule:
    # Once a day, 04:17 UTC
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A failed fetch keeps the last good data/projects/*.json, and the pages
      # are rebuilt from whatever is there.
      - run: node scripts/fetch-projects.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/build-projects.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data projects sitemap.xml index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update contributions and project data"
          git push
